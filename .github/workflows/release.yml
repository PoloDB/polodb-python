name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Match tag, Python metadata, and Cargo metadata
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          python_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          cargo_version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          if len({tag, python_version, cargo_version}) != 1:
              raise SystemExit(f"version mismatch: tag={tag}, pyproject={python_version}, cargo={cargo_version}")

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  wheels:
    name: Wheel for ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            before_script_linux: dnf install -y clang-devel
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            before_script_linux: export BINDGEN_EXTRA_CLANG_ARGS=--sysroot=/usr/aarch64-unknown-linux-gnu/aarch64-unknown-linux-gnu/sysroot
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v6
      - name: Set macOS Intel deployment target
        if: matrix.os == 'macos-15-intel'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.13" >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: ${{ matrix.before_script_linux || '' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI and GitHub
    if: github.ref_type == 'tag'
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
