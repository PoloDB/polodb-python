[project]
name = "polodb-python"
version = "0.2.0"
description = "Modern Python bindings for the embedded PoloDB document database"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "SENHAJI RHAZI Hamza", email = "hamza.senhajirhazi@gmail.com" },
]
keywords = ["database", "embedded", "document", "mongodb", "polodb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://www.polodb.org"
Documentation = "https://github.com/PoloDB/polodb-python#readme"
Repository = "https://github.com/PoloDB/polodb-python"
Issues = "https://github.com/PoloDB/polodb-python/issues"

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.14,<2",
    "mypy>=2.3",
    "pytest>=9.0.3",
    "ruff>=0.16.2",
    "ty>=0.0.64",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.maturin]
module-name = "polodb._rust"
python-source = "."
features = ["pyo3/extension-module"]
include = ["polodb/py.typed", "LICENSE.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["polodb"]

[tool.ty.src]
include = ["polodb"]
